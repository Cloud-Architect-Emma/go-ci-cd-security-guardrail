name: Go Security Guardrail

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  go-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Security Gate
        run: |
          go mod tidy
          go build -o gate ./cmd/gate

      - name: Run Go Security Gate
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "Scanning repository for secrets and API keys..."

          # Extract potential risky patterns from codebase
          CODE_INPUT=$(grep -rE "API_KEY|sk-" . || true)

          # Export for Go program
          export CODE_INPUT

          # Run Go security gate
          ./gate