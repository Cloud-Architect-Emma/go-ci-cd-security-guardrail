name: Go Security Guardrail

on:
  push:
    branches: ["main"]

jobs:
  go-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Security Gate
        run: go build -o gate ./cmd/gate

      - name: Run Security Gate
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: ./gate
